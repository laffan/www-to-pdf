[package]
name = "www-to-pdf"
version = "0.1.0"
description = "Capture a website, clean it up, and save it as a PDF."
authors = ["laffan"]
edition = "2021"
rust-version = "1.77"

# The mobile targets (iOS/Android) build this crate as a library.
[lib]
name = "www_to_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Pin to a minor version: with_webview exposes objc2/webkit types that can
# change across Tauri minor releases.
[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
# Header/footer/page-number stamping onto rendered PDFs (pure Rust).
lopdf = "0.43"

# Apple message sends via raw objc2: macOS uses it for the createPDF render
# pipeline; iOS uses it for the share-sheet (UIActivityViewController) export.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"

# block2 completion handlers are only used by the macOS render path so far.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
