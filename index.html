<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>www → pdf</title>
    <meta
      name="description"
      content="Capture a website, tidy it up, and save it as a PDF."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui.css" />
    <!-- Tell the injected editor engine this is the app's own page, so it does
         not mount its toolbar here (the same webview later navigates to remote
         sites, where the engine does mount). -->
    <script>window.__WWWPDF_IS_APP = true;</script>
  </head>
  <body>
    <!-- Indeterminate progress bar shown while a page is loading. A cross-origin
         navigation gives no real progress, so this is a moving indicator that
         reassures the user the app hasn't frozen on a slow connection. -->
    <div id="load-bar" class="load-bar" hidden><div class="load-bar-fill"></div></div>

    <!-- ============ SCREEN 1: URL ENTRY ============ -->
    <main id="entry" class="entry">
      <form id="url-form" class="url-form" autocomplete="off">
        <input
          id="url-input"
          type="url"
          inputmode="url"
          placeholder="https://example.com/article"
          required
        />
        <button type="submit">Load</button>
      </form>
      <p class="entry-note" id="entry-error" hidden></p>
      <p class="entry-status" id="entry-status" hidden></p>
      <ul id="history" class="history"></ul>
    </main>

    <!-- ============ SCREEN 2 (web build only): IFRAME VIEWER ============ -->
    <div id="viewer" class="viewer" hidden>
      <div class="viewer-bar">
        <button id="back-btn" class="ghost" title="New URL">← New URL</button>
        <span id="viewer-url" class="viewer-url"></span>
        <span class="spacer"></span>
        <button id="print-btn" class="primary">Save as PDF</button>
      </div>
      <div class="stage">
        <iframe
          id="frame"
          title="Loaded page"
          referrerpolicy="no-referrer"
        ></iframe>
        <!-- Shown when the page can't be edited in-frame (cross-origin / blocked). -->
        <div id="blocked" class="blocked" hidden>
          <div class="blocked-card">
            <h2>This page can't be edited in the browser</h2>
            <p id="blocked-reason"></p>
            <p>
              This is a browser security rule: a web page can't read or change
              another site's content. To capture pages like this — including
              anything behind a login — use the <strong>desktop or iOS app</strong>,
              which loads the page in a real webview with no such limit.
            </p>
            <div class="blocked-actions">
              <button id="open-tab" class="ghost">Open page in new tab</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
